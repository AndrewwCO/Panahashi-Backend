ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.panahashi.ApplicationKt.module ]
    }
}

firebase {
    serviceAccountPath = "serviceAccountKey.json"
    serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT_PATH}
    databaseUrl = "https://panahashi-default-rtdb.firebaseio.com"
    databaseUrl = ${?FIREBASE_DATABASE_URL}
}
